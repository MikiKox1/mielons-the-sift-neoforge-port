name: Publish The Sift 2.0.1

on:
  push:
    branches:
      - 'minecraft/26.2'

permissions:
  contents: write

concurrency:
  group: the-sift-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/minecraft/26.2' && github.event.head_commit.message == 'Publish source-only 2.0.1 via Actions MC26.2'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Minecraft 26.2 source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify official version and target
        shell: bash
        run: |
          set -euo pipefail
          mc="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          test "$mc" = "26.2"
          test "$GITHUB_REF" = "refs/heads/minecraft/${mc}"
          test "$version" = "2.0.1-neoforge.1-mc${mc}"
          test -s "CHANGELOG-${mc}.md"
          notes_file="$RUNNER_TEMP/the-sift-release-notes.md"
          awk -v start="## Port 2.0.1 — Minecraft ${mc}" \
              -v end="## Port 1.1.2.1 — Minecraft ${mc}" '
            $0 == start { in_release = 1; found_start = 1 }
            $0 == end && in_release { found_end = 1; exit }
            in_release { print }
            END { if (!found_start || !found_end) exit 1 }
          ' "CHANGELOG-${mc}.md" > "$notes_file" || {
            echo "Could not extract the complete 2.0.1 changelog entry."
            exit 1
          }
          test -s "$notes_file"
          if grep -Eiq 'alpha[0-9]|-alpha\.' gradle.properties README.md "$notes_file" "CHANGELOG-${mc}.md"; then
            echo 'Official release metadata contains a development version label.'
            exit 1
          fi
          echo "Publishing The Sift ${version} for Minecraft ${mc}"

      - name: Build and verify production JAR
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean build sourcesJar

      - name: Verify and prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mc="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          jar="build/libs/the_sift-${version}.jar"
          sources="build/libs/the_sift-${version}-sources.jar"
          test -s "$jar"
          test -s "$sources"
          unzip -tqq "$jar"
          unzip -tqq "$sources"
          unzip -p "$jar" META-INF/neoforge.mods.toml | grep -F "version=\"$version\""
          if unzip -p "$jar" META-INF/neoforge.mods.toml | grep -Eiq 'alpha[0-9]|-alpha\.'; then
            echo 'Pre-release metadata found in production mod.'
            exit 1
          fi
          mkdir -p dist
          cp "$jar" "dist/mielons-the-sift-2.0.1-mc${mc}-neoforge-port.jar"
          cp "$sources" "dist/mielons-the-sift-2.0.1-mc${mc}-neoforge-port-sources.jar"
          (cd dist && sha256sum *.jar > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Archive built binaries
        uses: actions/upload-artifact@v4
        with:
          name: the-sift-2.0.1-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error

      - name: Publish official GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mc="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          tag="v2.0.1-mc${mc}-neoforge"
          notes_file="$RUNNER_TEMP/the-sift-release-notes.md"
          test -s "$notes_file"
          latest=false
          if [[ "$mc" == "26.3" ]]; then latest=true; fi
          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --title "Port 2.0.1 — Minecraft $mc" --notes-file "$notes_file" --prerelease=false --latest="$latest"
          else
            gh release create "$tag" dist/* \
              --title "Port 2.0.1 — Minecraft $mc" \
              --notes-file "$notes_file" \
              --verify-tag \
              --latest="$latest"
          fi
          gh release view "$tag" --json tagName,isPrerelease,isDraft,url --jq '{tag: .tagName, draft: .isDraft, prerelease: .isPrerelease, url: .url}'
