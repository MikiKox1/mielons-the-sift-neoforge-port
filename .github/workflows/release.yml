name: Publish The Sift 2.0.1

on:
  push:
    branches:
      - minecraft/26.2
    tags:
      - 'v2.0.1-mc*-neoforge'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: the-sift-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/minecraft/26.2' &&
       github.event.head_commit.message == 'Refresh 2.0.1 release notes MC26.2')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify release target
        shell: bash
        run: |
          set -euo pipefail
          mc="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          test "$mc" = "26.2"
          test "$version" = "2.0.1-neoforge.1-mc$mc"
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            test "$GITHUB_REF_NAME" = "v2.0.1-mc$mc-neoforge"
          else
            test "$GITHUB_REF_NAME" = "minecraft/$mc"
            if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
              test "$(git log -1 --format=%s)" = 'Refresh 2.0.1 release notes MC26.2'
            fi
          fi
          test -s "CHANGELOG-$mc.md"

      - name: Prepare release description in the previous releases' style
        shell: bash
        run: |
          set -euo pipefail
          mc="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          minimum="$(sed -n 's/^neo_min_version=//p' gradle.properties)"
          geckolib="$(sed -n 's/^geckolib_version=//p' gradle.properties)"
          case "$mc" in
            26.1.2) easy_magic='26.1.0' ;;
            26.2) easy_magic='26.2.0' ;;
            26.3) easy_magic='26.3.0' ;;
            *) echo "Unsupported Minecraft version: $mc"; exit 1 ;;
          esac
          notes="$RUNNER_TEMP/the-sift-2.0.1-release.md"
          awk -v heading="## Port 2.0.1 — Minecraft $mc" '
            $0 == heading { copying = 1; found = 1; print "# " substr($0, 4); next }
            copying && $0 == "### Requirements" { stopped = 1; exit }
            copying { if ($0 == "### Changes") print "## Changes"; else print }
            END { if (!found || !stopped) exit 1 }
          ' "CHANGELOG-$mc.md" > "$notes"
          test -s "$notes"
          grep -Fq '## Changes' "$notes"
          printf '\n## Requirements\n\n- **Minecraft:** %s (exact version)\n- **NeoForge:** %s or newer (no upper version limit within the Minecraft series)\n- **Java:** 25\n- **GeckoLib:** %s or compatible 5.x (required)\n- **Optional integrations:** Easy Magic %s (with Puzzles Lib), LambDynamicLights, Iris and compatible Sodium, Photon / Complementary shaderpacks\n\n## Credits\n\n**Original mod:** Mielon (MIT License). **Unofficial NeoForge port:** MikiKox1 (AI-assisted). Original content, contributor names and asset credits are preserved in SOURCE_PROVENANCE.md and AI_DISCLOSURE.md.\n' "$mc" "$minimum" "$geckolib" "$easy_magic" >> "$notes"
          if grep -Eiq 'ALPHA[0-9]+|neoforge-alpha[.]' "$notes"; then
            echo 'Unexpected pre-release label in official release description'
            exit 1
          fi

      - name: Set up Java 25
        if: github.ref_type == 'tag'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        if: github.ref_type == 'tag'
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod and source JARs for a new tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean build sourcesJar

      - name: Prepare only the two JAR assets
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          mc="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          jar="build/libs/the_sift-$version.jar"
          sources="build/libs/the_sift-$version-sources.jar"
          test -s "$jar"
          test -s "$sources"
          unzip -tqq "$jar"
          unzip -tqq "$sources"
          unzip -p "$jar" META-INF/neoforge.mods.toml | grep -F "version=\"$version\""
          mkdir -p dist
          cp "$jar" "dist/mielons-the-sift-2.0.1-mc$mc-neoforge-port.jar"
          cp "$sources" "dist/mielons-the-sift-2.0.1-mc$mc-neoforge-port-sources.jar"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Archive the two JAR assets
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: the-sift-2.0.1-${{ github.run_id }}
          path: dist/*.jar
          if-no-files-found: error

      - name: Update official GitHub Release and remove checksum attachment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mc="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          tag="v2.0.1-mc$mc-neoforge"
          notes="$RUNNER_TEMP/the-sift-2.0.1-release.md"
          latest=false
          if [[ "$mc" == "26.3" ]]; then latest=true; fi
          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
              gh release upload "$tag" dist/*.jar --clobber
            fi
            gh release edit "$tag" --title "Port 2.0.1 — Minecraft $mc" --notes-file "$notes" --prerelease=false --latest="$latest"
          else
            if [[ "$GITHUB_REF_TYPE" != 'tag' ]]; then
              echo "Existing release required for notes-only refresh: $tag"
              exit 1
            fi
            gh release create "$tag" dist/*.jar --title "Port 2.0.1 — Minecraft $mc" --notes-file "$notes" --verify-tag --latest="$latest"
          fi
          if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq 'SHA256SUMS.txt'; then
            gh release delete-asset "$tag" 'SHA256SUMS.txt' --yes
          fi
          count="$(gh release view "$tag" --json assets --jq '.assets[].name' | wc -l)"
          test "$count" -eq 2
          gh release view "$tag" --json tagName,isPrerelease,isDraft,url --jq '{tag: .tagName, draft: .isDraft, prerelease: .isPrerelease, url: .url}'