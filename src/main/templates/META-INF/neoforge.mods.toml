modLoader="javafml"
# NeoForge MC26.3 provides FML Java language provider 12.
# This is NOT the NeoForge compatibility version range below.
loaderVersion="[12,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_author}"
credits="Development NeoForge 26.3 port: MikiKox1, assisted by AI; original author Mielon; ImpSteve — Dark Sniffer texture; Fuzja Jądrowa — Rift music disc; StrawberrySushi_ — Korean localization; Frumptle — Russian localization; Grelinho — Brazilian Portuguese localization; kulisaiji — Simplified Chinese localization; Echo_Dev — Wellspring remix; Lealeanz — ambient music"
displayURL="https://github.com/MikiKox1/mielons-the-sift-neoforge-port"
# FML 11.0.16 (NeoForge 26.2.0.90) explicitly recommends iconFile over the
# deprecated logoFile. This does not change the mod's loader version range.
iconFile="assets/the_sift/icon.png"
description='''${mod_description}'''

[[mixins]]
config="the_sift.mixins.json"

[[mixins]]
config="the_sift.client.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_min_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="geckolib"
type="required"
versionRange="[${geckolib_version},6)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="lambdynlights"
type="optional"
versionRange="[${lambdynlights_version},)"
ordering="AFTER"
side="CLIENT"

[[modproperties.${mod_id}."yumi:entrypoints"."lambdynlights:initializer"]]
value="mielon.thesift.client.light.TheSiftDynamicLightsInitializer"
