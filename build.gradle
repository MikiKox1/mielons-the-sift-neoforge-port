plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets {
    main {
        // The Fabric source release used split environment source sets. NeoForge
        // ships one universal mod JAR, so compile both trees into that JAR while
        // client-only entry points are migrated to Dist.CLIENT event hooks.
        java.srcDir 'src/client/java'
        resources.srcDir 'src/client/resources'
        resources.srcDir 'src/generated/resources'
    }
}

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup 'com.geckolib'
            includeGroup 'software.bernie.geckolib'
        }
    }

    // LambDynamicLights API is optional at runtime; 26.1.2 requires its own target ABI.
    maven {
        name = 'Gegy'
        url = uri('https://maven.gegy.dev')
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            // Keep local client runs separate from existing player worlds.
            gameDirectory = project.file("run/client")
        }

        server {
            server()
            // Must remain separate from the client and all player saves.
            gameDirectory = project.file("run/server")
            programArgument '--nogui'
        }

    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "com.geckolib:geckolib-neoforge-26.1.2:${project.geckolib_version}"
    // GeckoLib's runtime client mixins add GeoRenderState to vanilla render states.
    // Consume its published sidecar so ModDevGradle exposes the same interface at compile time.
    interfaceInjectionData "com.geckolib:geckolib-neoforge-26.1.2:${project.geckolib_version}"
    compileOnly "dev.lambdaurora.lambdynamiclights:lambdynamiclights-api:${project.lambdynlights_version}+${project.minecraft_version}"
}

// NeoForge compilation is valid when it matches this Minecraft series and
// meets the minimum supported loader. A newer Maven release is not required.
def pinnedNeoForge = project.neo_version.toString()
def pinnedNeoMinimum = project.neo_min_version.toString()
def targetMinecraft = project.minecraft_version.toString()
def targetMinecraftRange = project.minecraft_version_range.toString()
tasks.register('verifyNeoForgeCompatibility') {
    group = 'verification'
    description = 'Validate target Minecraft series and the minimum supported NeoForge version.'
    inputs.property('neo_version', pinnedNeoForge)
    inputs.property('neo_min_version', pinnedNeoMinimum)
    inputs.property('minecraft_version', targetMinecraft)
    inputs.property('minecraft_version_range', targetMinecraftRange)
    doLast {
        if (targetMinecraftRange != '[' + targetMinecraft + ']') {
            throw new GradleException('Minecraft version range must be [' +
                targetMinecraft + '], found ' + targetMinecraftRange)
        }

        def parseNeoForgeVersion = { String version ->
            def matcher = version =~ /^(\d+)\.(\d+)\.(\d+)\.(\d+)(?:-([A-Za-z0-9.-]+))?$/
            if (!matcher.matches()) {
                throw new GradleException('Invalid NeoForge version: ' + version)
            }
            return [
                minecraft: matcher.group(1) + '.' + matcher.group(2) + '.' + matcher.group(3),
                build: matcher.group(4).toInteger(),
                qualifier: matcher.group(5)
            ]
        }

        def expectedComponents = targetMinecraft.tokenize('.')
        if (expectedComponents.size() == 2) {
            expectedComponents << '0'
        }
        if (expectedComponents.size() != 3 ||
            !expectedComponents.every { it ==~ /\d+/ }) {
            throw new GradleException('Unsupported Minecraft version: ' + targetMinecraft)
        }
        def expectedSeries = expectedComponents.join('.')
        def compiled = parseNeoForgeVersion(pinnedNeoForge)
        def minimum = parseNeoForgeVersion(pinnedNeoMinimum)
        if (compiled.minecraft != expectedSeries ||
            minimum.minecraft != expectedSeries) {
            throw new GradleException('NeoForge compiler ' + pinnedNeoForge +
                ' and minimum ' + pinnedNeoMinimum +
                ' must target Minecraft ' + targetMinecraft)
        }
        if (compiled.build < minimum.build ||
            (compiled.build == minimum.build && compiled.qualifier != null &&
            (minimum.qualifier == null || compiled.qualifier != minimum.qualifier))) {
            throw new GradleException('NeoForge compiler ' + pinnedNeoForge +
                ' is below declared supported minimum ' + pinnedNeoMinimum)
        }

        logger.lifecycle('NeoForge compiler ' + pinnedNeoForge +
            ' supports Minecraft ' + targetMinecraft + ' at loader minimum ' +
            pinnedNeoMinimum + ' (without latest-version requirement)')
    }
}

tasks.matching {
    it.name in ['build', 'check', 'compileJava', 'runData', 'runServer', 'runClient']
}.configureEach {
    dependsOn tasks.named('verifyNeoForgeCompatibility')
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            neo_min_version         : neo_min_version,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_author              : mod_author,
            mod_description         : mod_description,
            geckolib_version        : geckolib_version,
            lambdynlights_version   : lambdynlights_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
