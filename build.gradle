plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets {
    main {
        // The Fabric source release used split environment source sets. NeoForge
        // ships one universal mod JAR, so compile both trees into that JAR while
        // client-only entry points are migrated to Dist.CLIENT event hooks.
        java.srcDir 'src/client/java'
        resources.srcDir 'src/client/resources'
        resources.srcDir 'src/generated/resources'
    }
    coreTest {
        // Package-private production helpers can be tested on a plain classpath,
        // but must not split their package across two FML modules.
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup 'com.geckolib'
            includeGroup 'software.bernie.geckolib'
        }
    }

    // LambDynamicLights API remains optional; use the exact 26.3 ABI.
    maven {
        name = 'Gegy'
        url = uri('https://maven.gegy.dev')
    }
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.test

    runs {
        client {
            client()
            // Standalone Prime 2 stage smoke; never the user's Modrinth profile.
            // A new loader release must never reuse a previous test world's directory.
            gameDirectory = project.file("run/client-${project.neo_version}-port-2.0.1-mc263-alpha4-alpha1")
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        clientRenderOpenGL {
            client()
            gameDirectory = project.file("run/client-${project.neo_version}-mc263-alpha4-render-opengl")
            programArguments.addAll('--graphicsBackend', 'OPENGL', '--quickPlayMultiplayer', '127.0.0.1:25616')
        }
        clientRenderVulkan {
            client()
            gameDirectory = project.file("run/client-${project.neo_version}-mc263-alpha4-render-vulkan")
            programArguments.addAll('--graphicsBackend', 'VULKAN', '--quickPlayMultiplayer', '127.0.0.1:25616')
        }
        clientVulkanBaseline {
            client()
            // Diagnostic control: same native loader/GPU, no The Sift mod loaded.
            gameDirectory = project.file("run/client-${project.neo_version}-mc263-alpha4-vulkan-baseline")
            programArguments.addAll('--graphicsBackend', 'VULKAN')
        }

        server {
            server()
            // Must remain separate from the client and all player saves.
            gameDirectory = project.file("run/server-${project.neo_version}-port-2.0.1-mc263-alpha4-alpha1")
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        serverEasyMagic {
            server()
            // Disposable integration check only; Easy Magic and Puzzles Lib
            // are copied into this run's mods folder, never the production jar.
            gameDirectory = project.file("run/server-${project.neo_version}-port-2.0.1-mc263-alpha4-alpha1-easymagic")
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        serverVisual {
            server()
            gameDirectory = project.file("run/server-${project.neo_version}-mc263-alpha4-visual-qa")
            programArgument '--nogui'
        }

        serverT11 {
            server()
            gameDirectory = project.file("run/server-T11-${project.neo_version}-mc263-alpha4-routing")
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'the_sift.tests.crossdimension', 'true'
        }
        serverMainPortalNatural {
            server()
            gameDirectory = project.file("run/server-T11-natural-${project.neo_version}-mainportal-alpha2")
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'the_sift.tests.crossdimension', 'true'
        }
        serverCopiedPortalGeometry {
            server()
            gameDirectory = project.file("run/server-T11-copied-${project.neo_version}-mainportal-alpha2")
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'the_sift.tests.crossdimension', 'true'
            systemProperty 'the_sift.tests.m26317copied', 'true'
        }

        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.test
            gameDirectory = project.file("run/gametest-${project.neo_version}-port-2.0.1-mc263-alpha4")
            systemProperty 'neoforge.enabledGameTestNamespaces', 'the_sift_tests'
        }
        gameTestServerEasyMagic {
            type = 'gameTestServer'
            sourceSet = sourceSets.test
            gameDirectory = project.file("run/gametest-${project.neo_version}-port-2.0.1-mc263-alpha4-easymagic")
            systemProperty 'neoforge.enabledGameTestNamespaces', 'the_sift_tests'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        the_sift_tests {
            sourceSet(sourceSets.test)
        }
    }
}

// Development tests have separate metadata and are never included in the mod JAR
// or ordinary client/server smoke runs.
neoForge.runs.named('client') {
    loadedMods = [neoForge.mods.getByName(project.mod_id)]
}
neoForge.runs.named('clientRenderOpenGL') {
    loadedMods = [neoForge.mods.getByName(project.mod_id)]
}
neoForge.runs.named('clientRenderVulkan') {
    loadedMods = [neoForge.mods.getByName(project.mod_id)]
}
neoForge.runs.named('clientVulkanBaseline') {
    loadedMods = []
}
neoForge.runs.named('server') {
    loadedMods = [neoForge.mods.getByName(project.mod_id)]
}
neoForge.runs.named('serverEasyMagic') {
    loadedMods = [neoForge.mods.getByName(project.mod_id)]
}
neoForge.runs.named('serverVisual') {
    loadedMods = [neoForge.mods.getByName(project.mod_id)]
}
neoForge.runs.named('serverT11') {
    loadedMods = [neoForge.mods.getByName(project.mod_id), neoForge.mods.getByName('the_sift_tests')]
}
neoForge.runs.named('serverMainPortalNatural') {
    loadedMods = [neoForge.mods.getByName(project.mod_id), neoForge.mods.getByName('the_sift_tests')]
}
neoForge.runs.named('serverCopiedPortalGeometry') {
    loadedMods = [neoForge.mods.getByName(project.mod_id), neoForge.mods.getByName('the_sift_tests')]
}
neoForge.runs.named('gameTestServer') {
    loadedMods = [neoForge.mods.getByName(project.mod_id), neoForge.mods.getByName('the_sift_tests')]
}
neoForge.runs.named('gameTestServerEasyMagic') {
    loadedMods = [neoForge.mods.getByName(project.mod_id), neoForge.mods.getByName('the_sift_tests')]
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "com.geckolib:geckolib-neoforge-26.3:${project.geckolib_version}"
    // GeckoLib's runtime client mixins add GeoRenderState to vanilla render states.
    // Consume its published sidecar so ModDevGradle exposes the same interface at compile time.
    interfaceInjectionData "com.geckolib:geckolib-neoforge-26.3:${project.geckolib_version}"
    compileOnly "dev.lambdaurora.lambdynamiclights:lambdynamiclights-api:${project.lambdynlights_version}+${project.minecraft_version}"
}

// Prime 2 invariant: build/test on the latest published NeoForge for this
// Minecraft line, while keeping the independent, OPEN-ENDED mod dependency
// range [neo_min_version,) (independently >=26.3.0.64-beta).
// Keep the compile/test loader pinned for reproducibility and refuse tests
// if that pin becomes stale. Do not conflate this pin with minimum support.
// If the metadata endpoint is unreachable, fail closed rather than claim the
// tested loader is current. This task does not install any application.
def pinnedNeoForge = project.neo_version.toString()
def pinnedNeoMinimum = project.neo_min_version.toString()
def targetMcVersion = project.minecraft_version.toString()
tasks.register('verifyLatestNeoForge') {
    group = 'verification'
    description = 'Confirm the pinned MC 26.3 NeoForge version is still the latest official Maven release.'
    inputs.property('neo_version', pinnedNeoForge)
    inputs.property('neo_min_version', pinnedNeoMinimum)
    inputs.property('minecraft_version', targetMcVersion)
    doLast {
        def metadataUrl = 'https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml'
        def connection = new URI(metadataUrl).toURL().openConnection()
        connection.setUseCaches(false)
        connection.setConnectTimeout(15000)
        connection.setReadTimeout(15000)
        connection.setRequestProperty('Cache-Control', 'no-cache')
        def metadata = connection.inputStream.withCloseable { it.getText('UTF-8') }
        def matcher = metadata =~ /<version>(26\.3\.0\.(\d+)(?:-[^<]+)?)<\/version>/
        def candidates = []
        matcher.each { match ->
            candidates << [version: match[1], build: Integer.parseInt(match[2])]
        }
        if (candidates.isEmpty()) {
            throw new GradleException('Cannot verify latest NeoForge 26.3 in official Maven metadata; test blocked.')
        }
        def latest = candidates.max { a, b ->
            (a.build <=> b.build) ?: ((a.version.contains('-') ? 0 : 1) <=> (b.version.contains('-') ? 0 : 1))
        }.version
        if (pinnedNeoForge != latest) {
            throw new GradleException(
                "NeoForge BUILD/TEST pin is outdated. Latest official MC 26.3: ${latest}; " +
                "neo_version=${pinnedNeoForge}. Update only neo_version for testing. " +
                'Keep independent neo_min_version and the open-ended [minimum,) dependency.'
            )
        }
        if (pinnedNeoMinimum != '26.3.0.64-beta') {
            throw new GradleException(
                "The Sift MC26.3 minimum must remain 26.3.0.64-beta unless explicitly disproved, found ${pinnedNeoMinimum}"
            )
        }
        logger.lifecycle("Verified latest NeoForge for MC ${targetMcVersion} build/tests: ${latest}; " +
            "packaged minimum: ${pinnedNeoMinimum}, no upper bound")
    }
}

tasks.matching {
    it.name in ['build', 'check', 'test', 'compileJava', 'compileTestJava', 'runData', 'runServer', 'runClient'] ||
        it.name.startsWith('runGameTest')
}.configureEach {
    dependsOn tasks.named('verifyLatestNeoForge')
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            neo_min_version         : neo_min_version,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_author              : mod_author,
            mod_description         : mod_description,
            geckolib_version        : geckolib_version,
            lambdynlights_version   : lambdynlights_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '1000']
}

tasks.register('coreContract', JavaExec) {
    group = 'verification'
    description = 'Run source-grounded core behavior contracts without launching Minecraft.'
    dependsOn tasks.named('coreTestClasses')
    classpath = sourceSets.coreTest.runtimeClasspath
    mainClass = 'mielon.thesift.worldgen.PortCoreContractTest'
    enableAssertions = true
}

// Differential pure-logic tests compare this port with the pinned original JAR.
tasks.register('writePortCompileClasspath') {
    def resolvedClasspath = sourceSets.main.compileClasspath
    def targetFile = layout.buildDirectory.file('port-compile-classpath.txt')
    outputs.file(targetFile)
    doLast {
        def file = targetFile.get().asFile
        file.parentFile.mkdirs()
        file.setText(resolvedClasspath.files.collect { it.absolutePath }.join('\n') + '\n', 'UTF-8')
    }
}

tasks.register('gameTestModJar', Jar) {
    group = 'verification'
    description = 'Package only the development GameTests for testing the actual built mod on the minimum loader.'
    dependsOn tasks.named('testClasses')
    from sourceSets.test.output
    archiveClassifier = 'gametests'
}

tasks.named('check') {
    dependsOn tasks.named('coreContract')
}

tasks.named('test') {
    // These sources contain native GameTests, not JUnit-annotated tests.
    // Their own server runner enforces success/failure.
    failOnNoDiscoveredTests = false
}

java {
    withSourcesJar()
}

tasks.named('jar', Jar) {
    from('LICENSE', 'AI_DISCLOSURE.md', 'SOURCE_PROVENANCE.md', 'UPSTREAM-26.3-RESOURCE-MANIFEST.json')
}
tasks.named('sourcesJar', Jar) {
    from('LICENSE', 'AI_DISCLOSURE.md', 'SOURCE_PROVENANCE.md', 'UPSTREAM-26.3-RESOURCE-MANIFEST.json')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Reviewed optional shader additions; required for independent artifact audit.
tasks.named('jar', Jar) { from('SHADER-INTEGRATION-RESOURCES.json') }
