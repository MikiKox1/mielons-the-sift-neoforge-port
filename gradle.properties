org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment
minecraft_version=26.3
minecraft_version_range=[26.3]
# The NeoForge toolchain version and the minimum supported loader are distinct.
# The mod dependency range has no upper bound: [neo_min_version,).
neo_version=26.3.0.101
neo_min_version=26.3.0.64-beta

# Dependencies
geckolib_version=5.5.7
lambdynlights_version=4.13.0

# Mod
mod_id=the_sift
mod_name=Mielon's The Sift
mod_license=MIT
mod_version=1.1.2.1
mod_group_id=mielon.thesift
mod_author=Mielon (original); MikiKox1 (NeoForge community port)
mod_description=Community NeoForge 26.3 port of Mielon's The Sift 1.1.2. Includes Singer shaderpack lighting and original-style Sift portal rendering.
