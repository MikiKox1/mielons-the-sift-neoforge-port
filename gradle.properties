org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment
minecraft_version=26.3
minecraft_version_range=[26.3]
# Compile/test with the latest verified NeoForge for MC 26.3.
# The MOD'S MINIMUM COMPATIBLE loader version is independent of the
# build/test version and must NOT be raised just because a newer loader is used.
# Keep an OPEN upper bound in META-INF/neoforge.mods.toml: [neo_min_version,).
neo_version=26.3.0.102
# Preserve the independent MC26.3 minimum; verify the final binary separately.
neo_min_version=26.3.0.64-beta

# Dependencies
geckolib_version=5.5.7
lambdynlights_version=4.13.0

# Mod
mod_id=the_sift
mod_name=Mielon's The Sift
mod_license=MIT
mod_version=2.0.3-neoforge.2-mc26.3
mod_group_id=mielon.thesift
mod_author=Mielon (original); MikiKox1 (NeoForge community port)
mod_description=Unofficial Mielon's The Sift 2.0.3 NeoForge port for MC 26.3; natural Bedrock advancement, Creative Rift closing, Nuzzle dye, native Sifter Cap and updated languages, with original gameplay and community shader/portal fixes preserved.
