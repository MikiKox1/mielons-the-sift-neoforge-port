org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment
minecraft_version=26.2
minecraft_version_range=[26.2]
# The NeoForge toolchain version and the minimum supported loader are distinct.
# The mod dependency range has no upper bound: [neo_min_version,).
neo_version=26.2.0.93
neo_min_version=26.2.0.90

# Dependencies
geckolib_version=5.5.6
lambdynlights_version=4.12.4

# Mod
mod_id=the_sift
mod_name=Mielon's The Sift
mod_license=MIT
mod_version=1.1.2.1
mod_group_id=mielon.thesift
mod_author=Mielon (original); MikiKox1 (NeoForge community port)
mod_description=Community NeoForge 26.2 port of Mielon's The Sift 1.1.2. Includes shader compatibility for Photon and Complementary.
