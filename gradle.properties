org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment
minecraft_version=26.2
minecraft_version_range=[26.2]
# Pinned compilation target. The mod's minimum loader is set separately below.
neo_version=26.2.0.93
# Open-ended loader requirement: [neo_min_version,) in neoforge.mods.toml.
neo_min_version=26.2.0.90

# Dependencies
geckolib_version=5.5.6
lambdynlights_version=4.12.4

# Mod
mod_id=the_sift
mod_name=Mielon's The Sift
mod_license=MIT
mod_version=2.0.2-neoforge.1-mc26.2
mod_group_id=mielon.thesift
mod_author=Mielon (original); MikiKox1 (NeoForge community port)
mod_description=The Sift 2.0.2 official NeoForge port for Minecraft 26.2, with expanded biomes, tidal skies, new creatures, the Monarch boss and adapted gameplay.
